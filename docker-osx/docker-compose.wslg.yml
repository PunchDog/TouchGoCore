# WSLg GUI + PulseAudio override
#
# 使用:
#   docker compose -f docker-compose.yml -f docker-compose.wslg.yml up --build
#
# 前置条件: Windows 11 / WSL2 已启用 WSLg，且 Docker 运行在 WSL 内。
# 该 override 把基础 compose 的无头显示改为 X11 窗口 + WSLg 音频，
# 同时保留 VNC 监听，使基础 compose 里的 5999 端口映射仍然有效（可远程/备用查看）。

services:
  macos-tahoe:
    environment:
      DISPLAY: ":0"
      AUDIO_DRIVER: "pa"
      PULSE_SERVER: "unix:/mnt/wslg/runtime-dir/pulse/native"
      XDG_RUNTIME_DIR: "/mnt/wslg/runtime-dir"
      # 清掉基础文件的 "-display none": QEMU 走默认 GTK 显示（qemu-desktop 已含 GTK UI）。
      # 保留 -vnc 使 5999 映射不落空；不需要远程查看也不会造成额外开销。
      EXTRA: "-vnc 0.0.0.0:99"
    volumes:
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg/runtime-dir:/mnt/wslg/runtime-dir
